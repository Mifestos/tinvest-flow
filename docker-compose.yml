# ==============================================================================
# TINVEST-FLOW: LOCAL DATA PLATFORM (Lambda/Kappa Architecture)
# ==============================================================================
# Архитектура:
# 1. Пакетная обработка (Batch): Airflow -> MinIO -> Spark -> Postgres -> ClickHouse
# 2. Потоковая обработка (Streaming): WebSocket -> Kafka -> Spark -> Postgres
#
# Оптимизация:
# - Образы Airflow и Spark скачиваются из GHCR (GitHub Container Registry)
# - Для локальной разработки можно раскомментировать 'build:' и закомментировать 'image:'
# ==============================================================================

x-airflow-common:
  &airflow-common
  # Для локальной сборки используйте build, для скачивания готового образа — image
  # build:
  #   context: .
  #   dockerfile: Dockerfile.airflow
  image: ghcr.io/mifestos/tinvest-flow-airflow:latest
  env_file:
    - .env
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW__CORE__FERNET_KEY:-}'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    PYTHONPATH: /opt/airflow/src
    MINIO_ENDPOINT: http://minio:9000
    POSTGRES_DWH_HOST: postgres_dwh
    CLICKHOUSE_HOST: clickhouse
    KAFKA_BOOTSTRAP: kafka:9092
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: 120
    AIRFLOW__CELERY__WORKER_CONCURRENCY: 2
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/src:/opt/airflow/src
    - ${AIRFLOW_PROJ_DIR:-.}/alembic.ini:/opt/airflow/alembic.ini
    - ${AIRFLOW_PROJ_DIR:-.}/migrations:/opt/airflow/migrations
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  # ============================================================================
  # 1. Слой хранения данных (Storage Layer)
  # ============================================================================
  
  # Bronze Layer: Data Lake (Raw JSON)
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: always
    volumes:
      - ./data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  # Init script to create default buckets on startup
  minio-init:
    image: ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set localminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing localminio/bronze;
      mc mb --ignore-existing localminio/checkpoints;
      "

  # Silver Layer: Relational DWH (Clean, structured data)
  postgres_dwh:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: dwh
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres-dwh-volume:/var/lib/postgresql/data
      - ./infra/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh"]
      interval: 5s
      retries: 5

  # Gold Layer: Analytical MPP Database (Fast aggregations)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
    ports:
      - "8123:8123"
      - "9004:9000"
    volumes:
      - clickhouse-volume:/var/lib/clickhouse
      - ./infra/clickhouse-init:/docker-entrypoint-initdb.d

  # ============================================================================
  # 2. Слой потоковой передачи данных (Streaming Layer)
  # ============================================================================

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3

  # ============================================================================
  # 3. Слой распределенных вычислений (Compute Layer)
  # ============================================================================

  spark-master:
    # Для локальной сборки используйте build, для скачивания — image
    # build:
    #   context: .
    #   dockerfile: Dockerfile.spark
    image: ghcr.io/mifestos/tinvest-flow-spark:latest
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - POSTGRES_DWH_HOST=postgres_dwh
      - SPARK_DAEMON_MEMORY=512m 
      - PYTHONPATH=/opt/spark-apps/src
    ports:
      - "8082:8080"
      - "7077:7077"
      - "6066:6066"
    volumes:
      - ./src:/opt/spark-apps/src

  spark-worker:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.spark
    image: ghcr.io/mifestos/tinvest-flow-spark:latest
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - POSTGRES_DWH_HOST=postgres_dwh
      - SPARK_DAEMON_MEMORY=512m
      - PYTHONPATH=/opt/spark-apps/src
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark-apps/src

  spark-streaming:
    image: ghcr.io/mifestos/tinvest-flow-spark:latest
    container_name: tinvest-spark-streaming
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - POSTGRES_DWH_HOST=postgres_dwh
      - PYTHONPATH=/opt/spark-apps/src 
    depends_on:
      - spark-master
    volumes:
      - ./src:/opt/spark-apps/src
    restart: always
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.jars.ivy=/tmp/.ivy
      --conf spark.sql.shuffle.partitions=4
      --conf spark.sql.session.timeZone=UTC
      --conf spark.streaming.stopGracefullyOnShutdown=true
      --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
      --conf spark.hadoop.fs.s3a.access.key=minioadmin
      --conf spark.hadoop.fs.s3a.secret.key=minioadmin
      --conf spark.hadoop.fs.s3a.path.style.access=true
      --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
      --packages org.postgresql:postgresql:42.7.1,org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.0,org.apache.hadoop:hadoop-aws:3.4.1,com.amazonaws:aws-java-sdk-bundle:1.12.262
      /opt/spark-apps/src/tinvest_flow/processing/stream_trades_to_silver.py
      --conf spark.driver.memory=512m
      --conf spark.executor.memory=512m

  # ============================================================================
  # 4. Слой бизнес-аналитики и визуализации (BI Layer)
  # ============================================================================

  metabase:
    image: metabase/metabase:latest
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./plugins:/plugins
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: "-Xmx1g"
    depends_on:
      clickhouse:
        condition: service_started

  # ============================================================================
  # 5. Слой оркестрации (Orchestration Layer)
  # ============================================================================

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    image: redis:7.2-alpine
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

  # ============================================================================
  # 6. Демонстрационный контур (Demo Sandbox)
  # ============================================================================

  trade-simulator:
    image: ghcr.io/mifestos/tinvest-flow-airflow:latest
    container_name: demo-trade-simulator
    command: python /opt/airflow/demo/simulator.py
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
    volumes:
      - ./demo:/opt/airflow/demo
    depends_on:
      kafka:
        condition: service_started

volumes:
  postgres-db-volume:
  postgres-dwh-volume:
  clickhouse-volume:
  metabase-data: