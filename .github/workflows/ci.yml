name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pip install -e ".[dev]"
        env:
          PIP_EXTRA_INDEX_URL: https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple
          PIP_TRUSTED_HOST: opensource.tbank.ru
          
      - name: Lint & Type check
        run: |
          ruff check .
          mypy src/
          
      - name: Test
        run: pytest
        env:
          TINKOFF_SANDBOX_TOKEN: "test_token"
          TINKOFF_SANDBOX_ACCOUNT_ID: "test_account_id"
          POSTGRES_DWH_USER: "dwh"
          POSTGRES_DWH_PASSWORD: "dwh"
          POSTGRES_DWH_DB: "dwh"
          POSTGRES_DWH_HOST: "localhost"
          CLICKHOUSE_HOST: "localhost"

      - name: Check Alembic migrations (dry-run)
        run: alembic upgrade head --sql > /dev/null
        env:
          POSTGRES_DWH_USER: "dwh"
          POSTGRES_DWH_PASSWORD: "dwh"
          POSTGRES_DWH_DB: "dwh"
          POSTGRES_DWH_HOST: "localhost"

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Airflow image (dry-run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.airflow
          push: false
          tags: test-airflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max