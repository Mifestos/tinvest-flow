[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinvest-flow"
version = "0.1.0"
description = "Real-time DWH & Data Marts on T-Invest API"
requires-python = ">=3.10"
dependencies = [
    "t-tech-investments",
    "aiokafka>=0.10",
    "boto3>=1.34",
    "psycopg2-binary>=2.9",
    "clickhouse-connect>=0.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "python-json-logger>=2.0.7",
    "tenacity>=8.2",
    "pandas>=2.0",
    "alembic>=1.13",
    "sqlalchemy>=1.4.36,<2.0",
    "pyspark==4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "pandas-stubs",
]
spark = ["pyspark==4.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tinvest_flow*"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RET"]
ignore = ["N812"] 

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
packages = ["tinvest_flow"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=tinvest_flow --cov-report=term-missing"

[tool.coverage.run]
source = ["src/tinvest_flow"]
branch = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "aiokafka.*",
    "pyspark.*",
    "airflow.*",
    "t_tech.*",
    "psycopg2.*",
    "tenacity.*",
]
ignore_missing_imports = true