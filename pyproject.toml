[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinvest-flow"
version = "0.1.0"
description = "Real-time DWH & Data Marts on T-Invest API (portfolio project)"
requires-python = ">=3.11"
dependencies = []

# ВОТ ОНА - МАГИЯ SRC-LAYOUT:
[tool.setuptools.packages.find]
where = ["src"]
include = ["tinvest_flow*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]